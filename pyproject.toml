[project]
# PLACEHOLDER dist name (ADR-004): the distribution name is UNDECIDED.
# "raven" on PyPI is Sentry's legacy client - NEVER publish under it (or
# any name) without a fresh decision. Install from source: pip install -e .
name = "raven"
# Single-sourced from raven_bus.__version__ (see [tool.hatch.version]).
dynamic = ["version"]
description = "Channel-based coordination bus for multi-agent runs: an append-only SQLite log with broadcast, queue and stream channels"
authors = [{ name = "0xDarkMatter" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
keywords = ["message-bus", "agents", "sqlite", "messaging", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
http = ["starlette>=0.37", "uvicorn>=0.30"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "ruff",
]

[project.scripts]
raven = "raven_bus.cli.main:cli_main"

[project.urls]
Homepage = "https://github.com/0xDarkMatter/raven"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The ONE version string lives in the package (__version__ = "..."), so
# importlib.metadata / pip / uv report what `raven version` prints.
path = "src/raven_bus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/raven_bus"]

[tool.hatch.build.targets.wheel.force-include]
"src/raven_bus/migrations/0002_v2_schema.sql" = "raven_bus/migrations/0002_v2_schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["raven_bus"]
branch = false

[tool.coverage.report]
# Defensive guards + platform-specific paths are tagged `# pragma: no cover`
# inline. With those excluded, the suite covers 100% of executable lines.
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 100
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Demo agents keep a blanket safety net so one bad handler can't kill the
# whole multi-agent example; tests assert returncode explicitly instead of
# using subprocess's check.
"examples/*/agents.py" = ["BLE001"]
"tests/integration/*" = ["PLW1510"]
